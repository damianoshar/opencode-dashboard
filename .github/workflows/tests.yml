name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  scratch:
    name: Scratch tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the dependencies
        run: python -m pip install -r requirements.txt

      # The scratch tests build a miniature database in a temp directory and
      # fake every OpenCode CLI call, so they cannot touch a real database.
      # The live tests need an actual opencode.db and are run locally.
      - name: Run the scratch tests
        run: python -m pytest -m scratch -v

      - name: Check the JavaScript syntax
        run: node --check dashboard/static/app.js

      - name: Build the GitHub Pages site
        run: python scripts/build_docs.py --out site
